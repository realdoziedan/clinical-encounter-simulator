name: Rebuild single-file edition

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "references/**"
      - "docs/**"
      - "templates/**"
      - "scripts/build_single_file.py"
      - ".github/workflows/build-single-file.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check package integrity
        run: python tests/validate_package.py

      - name: Build single file
        run: python scripts/build_single_file.py

      - name: Commit if changed
        run: |
          git add dist/clinical-encounter-simulator-single.md
          if git diff --cached --quiet; then
            echo "Single file already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild single-file edition"
          git push
